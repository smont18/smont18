<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Terminal de Lucas Monteiro</title>
  <desc id="d">Janela de terminal com o comando whoami e o nome Lucas Monteiro, seguido de suas áreas: suporte técnico de TI, redes, Linux e segurança da informação.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1b2738" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4db8c4"/>
      <stop offset="1" stop-color="#79a6e8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="14" fill="#0a0f14"/>
  <rect width="1000" height="300" rx="14" fill="url(#grid)"/>

  <rect x="36" y="30" width="928" height="240" rx="12" fill="#0d141b" stroke="#223040" stroke-width="1.5"/>
  <path d="M36 42a12 12 0 0 1 12-12h904a12 12 0 0 1 12 12v22H36z" fill="#101820"/>
  <line x1="36" y1="64" x2="964" y2="64" stroke="#223040" stroke-width="1"/>
  <circle cx="64" cy="47" r="6" fill="#ff5f56"/>
  <circle cx="86" cy="47" r="6" fill="#ffbd2e"/>
  <circle cx="108" cy="47" r="6" fill="#27c93f"/>
  <text x="500" y="52" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" fill="#8fa4b8">lucas@fedora: ~</text>

  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
    <text x="66" y="104" font-size="20" fill="#4db8c4">$</text>
    <text x="90" y="104" font-size="20" fill="#e8eef4">whoami</text>

    <text x="66" y="162" font-size="52" font-weight="700" fill="#e8eef4">Lucas Monteiro</text>
    <rect x="66" y="176" width="300" height="4" rx="2" fill="url(#bar)"/>

    <text x="66" y="212" font-size="19" fill="#8fa4b8">Suporte técnico de TI · Redes · Linux · Segurança da informação</text>

    <text x="66" y="248" font-size="20" fill="#4db8c4">$</text>
    <rect x="90" y="232" width="11" height="20" fill="#e2a463">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="940" y="252" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14" fill="#62778c">Manaus, AM</text>
</svg>
